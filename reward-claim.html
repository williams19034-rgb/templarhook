<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reward Claim Page</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background: #e9eaec;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 15px;
    }

    .card {
      width: 480px;
      max-width: 100%;
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(0, 0, 0, .08);
    }

    .browser-bar {
      background: #f5f5f5;
      padding: 12px 18px;
      border-bottom: 1px solid #ececec;
    }

    .dots {
      display: flex;
      gap: 8px;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .red { background: #ff5f57; }
    .yellow { background: #ffbd2e; }
    .green { background: #28c840; }

    .content {
      padding: 30px 20px 25px;
      text-align: center;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #f3f4f6;
      padding: 6px 14px;
      border-radius: 50px;
      margin-bottom: 20px;
    }

    .logo {
      width: 14px;
      height: 14px;
      border: 1.5px solid #1d3557;
      border-radius: 50%;
      position: relative;
    }

    .logo::before {
      content: "";
      position: absolute;
      left: 4px;
      top: 1.5px;
      width: 4px;
      height: 6px;
      border-left: 1.5px solid #d4af37;
      border-right: 1.5px solid #d4af37;
      transform: skew(-10deg);
    }

    .brand span {
      font-weight: 600;
      color: #34495e;
      font-size: 14px;
    }

    h1 {
      font-size: 32px;
      line-height: 1.2;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 12px;
    }

    .subtitle {
      color: #64748b;
      font-size: 18px;
      margin-bottom: 25px;
      line-height: 1.4;
    }

    .claim-btn {
      display: block;
      width: 100%;
      background: #23a243;
      color: #fff;
      text-decoration: none;
      font-size: 20px;
      font-weight: 700;
      padding: 16px;
      border-radius: 6px;
      transition: background .3s;
    }

    .claim-btn:hover {
      background: #1c8c39;
    }

    .footer {
      background: #eef7f0;
      padding: 15px;
      text-align: center;
      font-size: 14px;
      font-weight: 600;
      color: #14532d;
    }

    @media (max-width: 480px) {
      h1 { font-size: 26px; }
      .subtitle { font-size: 16px; }
      .claim-btn {
        font-size: 18px;
        padding: 14px;
      }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="browser-bar" aria-hidden="true">
      <div class="dots">
        <div class="dot red"></div>
        <div class="dot yellow"></div>
        <div class="dot green"></div>
      </div>
    </div>

    <section class="content">
      <div class="brand">
        <div class="logo" aria-hidden="true"></div>
        <span>EarnBest.ng</span>
      </div>

      <h1>Don’t Miss out. Your ₦25,000 reward is ready</h1>
      <p class="subtitle">Join the WhatsApp Group to confirm your reward status..</p>
      <a
        href="https://chat.whatsapp.com/EMW22GhoQfNDGyKAvx0UOB"
        class="claim-btn"
        target="_blank"
        rel="noopener noreferrer"
      >Click Here to Claim Your Reward Now</a>
    </section>

    <footer class="footer">Limited slots available. Don't let your cash expire...</footer>
  </main>
</body>
</html>
